<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Track • Aether</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

    :root {
      --bg: #0a0f1c;
      --card: #111827;
      --border: #1f2937;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system_ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #e2e8f0;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 32px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      background: #0a0f1c;
      border: 1px solid #1f2937;
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
    }

    .file-input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .file-input-wrapper input[type="text"] {
      flex: 1;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #5558e0;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
    }

    .section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #1f2937;
    }

    .help {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      gap: 12px;
    }

    .big-button {
      flex: 1;
      padding: 16px;
      font-size: 17px;
      background: white;
      color: #0a0f1c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Add New Track</h1>
    <p class="subtitle">Simple. Fill the form → Download updated tracks.json</p>

    <div style="margin-bottom: 20px; display: flex; gap: 8px;">
      <button type="button" id="mode-add-btn" class="btn" style="background:#6366f1; color:white;">Add New Track</button>
      <button type="button" id="mode-edit-btn" class="btn-secondary">Edit Existing Track</button>
    </div>

    <div class="card">
      <form id="track-form">

        <!-- Basic Info -->
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" required placeholder="Beautiful Night">
        </div>

        <div class="form-group">
          <label>Artist</label>
          <input type="text" id="artist" value="PW Peck">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Duration</label>
            <input type="text" id="duration" placeholder="3:45">
          </div>
          <div class="form-group">
            <label>BPM</label>
            <input type="number" id="bpm" placeholder="78">
          </div>
        </div>

        <div class="form-group">
          <label>Genre</label>
          <input type="text" id="genre" placeholder="Blues">
        </div>

        <div class="form-group">
          <label>Moods (comma separated)</label>
          <input type="text" id="mood" placeholder="Romantic, Smooth">
        </div>

        <!-- Audio File -->
        <div class="form-group">
          <label>Audio File (.mp3)</label>
          <div class="file-input-wrapper">
            <input type="text" id="audioFile" placeholder="song.mp3" style="flex: 1;">
            <button type="button" onclick="document.getElementById('audioUpload').click()">Browse</button>
            <input type="file" id="audioUpload" accept="audio/*" style="display: none;" onchange="handleAudioFile(this)">
          </div>
        </div>

        <!-- Cover File -->
        <div class="form-group">
          <label>Cover Image (.jpg)</label>
          <div class="file-input-wrapper">
            <input type="text" id="coverFile" placeholder="cover.jpg" style="flex: 1;">
            <button type="button" onclick="document.getElementById('coverUpload').click()">Browse</button>
            <input type="file" id="coverUpload" accept="image/*" style="display: none;" onchange="handleCoverFile(this)">
          </div>
        </div>

        <div class="form-group">
          <label>R2 Base URL</label>
          <input type="text" id="r2Base" value="https://pub-d36e4f8ccd12409cb5f92373630441e1.r2.dev">
        </div>

        <!-- Load existing tracks.json -->
        <div class="section">
          <div class="form-group">
            <label>Load your current tracks.json (recommended)</label>
            <div class="file-input-wrapper">
              <button type="button" class="btn-secondary" onclick="document.getElementById('tracksUpload').click()" style="width: 100%;">
                Choose tracks.json file
              </button>
              <input type="file" id="tracksUpload" accept=".json" style="display: none;" onchange="loadExistingTracks(this)">
            </div>
            <div class="help" id="tracks-status">No file loaded yet. New tracks will start from scratch.</div>
          </div>

          <!-- Edit mode selector -->
          <div id="edit-track-section" style="display:none; margin-top:12px;">
            <label>Select track to edit</label>
            <select id="edit-track-select" class="input" style="width:100%;">
              <option value="">-- Select a track --</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="big-button">Generate &amp; Download Updated tracks.json</button>
        </div>

      </form>
    </div>
  </div>

  <script>
    let existingTracks = [];
    let isEditMode = false;
    let editingIndex = -1;

    function handleAudioFile(input) {
      if (!input.files.length) return;
      const file = input.files[0];
      document.getElementById('audioFile').value = file.name;

      // Try to read duration
      const audio = new Audio();
      audio.src = URL.createObjectURL(file);
      audio.onloadedmetadata = () => {
        const min = Math.floor(audio.duration / 60);
        const sec = Math.floor(audio.duration % 60);
        document.getElementById('duration').value = `${min}:${sec.toString().padStart(2,'0')}`;
        URL.revokeObjectURL(audio.src);
      };
    }

    function handleCoverFile(input) {
      if (!input.files.length) return;
      document.getElementById('coverFile').value = input.files[0].name;
    }

    function loadExistingTracks(input) {
      if (!input.files.length) return;

      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          existingTracks = Array.isArray(data) ? data : (data.tracks || []);
          document.getElementById('tracks-status').textContent = 
            `Loaded ${existingTracks.length} existing tracks. Ready to add new one.`;
          document.getElementById('tracks-status').style.color = '#4ade80';

          // If we're in edit mode, refresh the dropdown
          if (isEditMode) {
            updateEditSelect();
          }
        } catch (err) {
          alert("Could not read the file. Make sure it's a valid tracks.json");
        }
      };

      reader.readAsText(file);
    }

    function getFilenameFromUrl(url) {
      if (!url) return '';
      return url.split('/').pop();
    }

    function populateFormFromTrack(track) {
      document.getElementById('title').value = track.title || '';
      document.getElementById('artist').value = track.artist || '';
      document.getElementById('duration').value = track.duration || '';
      document.getElementById('bpm').value = track.bpm || '';
      document.getElementById('genre').value = track.genre || '';
      document.getElementById('mood').value = Array.isArray(track.mood) ? track.mood.join(', ') : (track.mood || '');
      document.getElementById('price').value = track.price || 0.99;

      // Extract filenames from full URLs
      document.getElementById('audioFile').value = getFilenameFromUrl(track.audio);
      document.getElementById('coverFile').value = getFilenameFromUrl(track.cover);

      // Update preview
      updatePreview();
    }

    function updateEditSelect() {
      const select = document.getElementById('edit-track-select');
      if (!select) return;

      select.innerHTML = '<option value="">-- Select a track --</option>';

      existingTracks.forEach((track, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${track.title} — ${track.artist}`;
        select.appendChild(option);
      });

      select.onchange = function() {
        const idx = parseInt(this.value);
        if (!isNaN(idx) && existingTracks[idx]) {
          editingIndex = idx;
          populateFormFromTrack(existingTracks[idx]);
        }
      };
    }

    function setEditMode(enabled) {
      isEditMode = enabled;
      const editSection = document.getElementById('edit-track-section');
      const submitBtn = document.querySelector('#track-form .big-button');

      if (editSection) {
        editSection.style.display = enabled ? 'block' : 'none';
      }

      if (submitBtn) {
        submitBtn.textContent = enabled 
          ? 'Update Track & Download Updated tracks.json' 
          : 'Generate & Download Updated tracks.json';
      }

      if (enabled) {
        updateEditSelect();
      } else {
        editingIndex = -1;
        const select = document.getElementById('edit-track-select');
        if (select) select.value = '';
      }
    }

    // Mode switcher buttons
    function setupModeButtons() {
      const addBtn = document.getElementById('mode-add-btn');
      const editBtn = document.getElementById('mode-edit-btn');

      if (addBtn) {
        addBtn.onclick = () => {
          addBtn.classList.add('btn');
          addBtn.classList.remove('btn-secondary');
          editBtn.classList.add('btn-secondary');
          editBtn.classList.remove('btn');
          setEditMode(false);
        };
      }

      if (editBtn) {
        editBtn.onclick = () => {
          if (existingTracks.length === 0) {
            alert("Please load your tracks.json first using the 'Load from file' button above.");
            return;
          }
          editBtn.classList.add('btn');
          editBtn.classList.remove('btn-secondary');
          addBtn.classList.add('btn-secondary');
          addBtn.classList.remove('btn');
          setEditMode(true);
        };
      }
    }

    document.getElementById('track-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const artist = document.getElementById('artist').value.trim();
      const duration = document.getElementById('duration').value.trim();
      const bpm = parseInt(document.getElementById('bpm').value) || 0;
      const genre = document.getElementById('genre').value.trim();
      const moodStr = document.getElementById('mood').value.trim();
      const mood = moodStr ? moodStr.split(',').map(s => s.trim()) : [];

      const audioFile = document.getElementById('audioFile').value.trim();
      const coverFile = document.getElementById('coverFile').value.trim();
      const r2Base = document.getElementById('r2Base').value.trim().replace(/\/$/, '');

      const updatedTrack = {
        id: isEditMode && editingIndex >= 0 ? existingTracks[editingIndex].id : Date.now(),
        title: title,
        artist: artist,
        duration: duration,
        bpm: bpm,
        genre: genre,
        mood: mood,
        price: 0.99,
        audio: audioFile ? `${r2Base}/audio/${audioFile}` : '',
        cover: coverFile ? `${r2Base}/covers/${coverFile}` : '',
        plays: isEditMode && editingIndex >= 0 ? existingTracks[editingIndex].plays || 0 : 0,
        downloads: isEditMode && editingIndex >= 0 ? existingTracks[editingIndex].downloads || 0 : 0,
        isNew: true,
        aiGenerated: true,
        created: isEditMode && editingIndex >= 0 ? existingTracks[editingIndex].created : new Date().toISOString().split('T')[0]
      };

      let allTracks;
      if (isEditMode && editingIndex >= 0) {
        // Update existing
        allTracks = [...existingTracks];
        allTracks[editingIndex] = updatedTrack;
      } else {
        // Add new
        allTracks = [...existingTracks, updatedTrack];
      }

      const output = JSON.stringify({ tracks: allTracks }, null, 2);

      // Download
      const blob = new Blob([output], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tracks.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      alert(isEditMode 
        ? "Track updated! Downloaded updated tracks.json." 
        : "Track added! Downloaded updated tracks.json. Replace your old one and push to Vercel.");
    });

    // Auto-suggest filename from title
    document.getElementById('title').addEventListener('blur', function() {
      const title = this.value.trim();
      const audio = document.getElementById('audioFile');
      const cover = document.getElementById('coverFile');

      if (title && !audio.value) {
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        audio.value = slug + '.mp3';
      }
      if (title && !cover.value) {
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        cover.value = slug + '.jpg';
      }
    });

    // Initialize mode buttons
    setupModeButtons();

    console.log('%c[Add Track] Simple version loaded', 'color:#64748b');
  </script>
</body>
</html>
